# ================= CONGES =================
# Rôles : ADMIN gère tous les congés ; EMPLOYE ne voit et ne gère que les siens.
# Erreurs au format { message } : 400 données invalides, 401 token, 403 rôle ou propriété,
# 404 introuvable, 409 transition de statut impossible.

  /conges:

    get:
      tags:
        - Congés
      summary: Lister les congés (ADMIN)
      description: Retourne tous les congés avec l'employé associé, triés par date de début décroissante.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: statut
          required: false
          schema:
            type: string
            enum: [EN_ATTENTE, VALIDE, REFUSE]
      responses:
        "200":
          description: Liste des congés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conge"
        "400":
          description: Statut invalide
        "401":
          description: Token manquant ou invalide
        "403":
          description: Rôle insuffisant (ADMIN requis)

    post:
      tags:
        - Congés
      summary: Demander un congé
      description: >
        Le congé est créé au statut EN_ATTENTE. Un EMPLOYE crée toujours pour son propre employé
        (l'employeId du corps est ignoré). Un ADMIN doit préciser employeId.
        Les congés EN_ATTENTE et VALIDE du même employé ne doivent pas chevaucher la période.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConge"
      responses:
        "201":
          description: Congé créé (EN_ATTENTE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conge"
        "400":
          description: Dates invalides, employeId manquant (ADMIN) ou chevauchement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          description: Token manquant ou invalide
        "403":
          description: Compte EMPLOYE non associé à un employé
        "404":
          description: Employé introuvable

  /conges/moi:

    get:
      tags:
        - Congés
      summary: Mes congés
      description: Congés de l'employé associé au compte connecté.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des congés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conge"
        "401":
          description: Token manquant ou invalide
        "403":
          description: Compte non associé à un employé

  /conges/employe/{employeId}:

    get:
      tags:
        - Congés
      summary: Congés d'un employé
      description: ADMIN, ou l'employé concerné uniquement.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: employeId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Liste des congés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conge"
        "401":
          description: Token manquant ou invalide
        "403":
          description: Congés d'un autre employé

  /conges/{id}:

    get:
      tags:
        - Congés
      summary: Détail d'un congé
      description: ADMIN, ou l'employé concerné uniquement.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Congé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conge"
        "401":
          description: Token manquant ou invalide
        "403":
          description: Congé d'un autre employé
        "404":
          description: Congé introuvable

    put:
      tags:
        - Congés
      summary: Modifier les dates d'un congé
      description: ADMIN, ou EMPLOYE propriétaire seulement si le congé est EN_ATTENTE.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConge"
      responses:
        "200":
          description: Congé modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conge"
        "400":
          description: Dates invalides ou chevauchement
        "401":
          description: Token manquant ou invalide
        "403":
          description: Congé d'un autre employé
        "404":
          description: Congé introuvable
        "409":
          description: Congé déjà traité (EMPLOYE)

    delete:
      tags:
        - Congés
      summary: Supprimer un congé
      description: ADMIN, ou EMPLOYE propriétaire seulement si le congé est EN_ATTENTE.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Congé supprimé
        "401":
          description: Token manquant ou invalide
        "403":
          description: Congé d'un autre employé
        "404":
          description: Congé introuvable
        "409":
          description: Congé déjà traité (EMPLOYE)

  /conges/{id}/valider:

    patch:
      tags:
        - Congés
      summary: Valider un congé (ADMIN)
      description: EN_ATTENTE vers VALIDE. Enregistre traiteParId et traiteLe.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Congé validé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conge"
        "401":
          description: Token manquant ou invalide
        "403":
          description: Rôle insuffisant (ADMIN requis)
        "404":
          description: Congé introuvable
        "409":
          description: Transition impossible (congé déjà validé ou refusé)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /conges/{id}/refuser:

    patch:
      tags:
        - Congés
      summary: Refuser un congé (ADMIN)
      description: EN_ATTENTE vers REFUSE, avec un motif obligatoire.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefuserConge"
      responses:
        "200":
          description: Congé refusé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conge"
        "400":
          description: Motif de refus manquant
        "401":
          description: Token manquant ou invalide
        "403":
          description: Rôle insuffisant (ADMIN requis)
        "404":
          description: Congé introuvable
        "409":
          description: Transition impossible (congé déjà validé ou refusé)


# ================= PAIE =================

  /paie/{employeId}:

    get:
      tags:
        - Paie
      summary: Calculer la paie d'un employé sur une période
      description: >
        Calcul à la volée, rien n'est enregistré. Seuls les congés VALIDE sont payés.
        ADMIN pour tout employé ; EMPLOYE uniquement pour son propre employeId.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: employeId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: dateDebut
          required: true
          schema:
            type: string
            format: date
            example: "2026-08-01"
        - in: query
          name: dateFin
          required: true
          schema:
            type: string
            format: date
            example: "2026-08-31"
      responses:
        "200":
          description: Résultat du calcul
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultatPaie"
        "400":
          description: Dates manquantes, invalides ou début après fin
        "401":
          description: Token manquant ou invalide
        "403":
          description: Paie d'un autre employé (EMPLOYE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Employé introuvable
        "500":
          description: Erreur lors du calcul de la paie


# ================= UTILISATEURS =================

  /users:

    get:
      tags:
        - Utilisateurs
      summary: Lister les comptes (ADMIN)
      description: id, nom, email, role et employeId de chaque compte, sans mot de passe.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des comptes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Token manquant ou invalide
        "403":
          description: Rôle insuffisant (ADMIN requis)

  /users/{id}/employe:

    patch:
      tags:
        - Utilisateurs
      summary: Lier un compte à un employé (ADMIN)
      description: >
        Renseigne User.employeId. Sans effet si le compte est déjà lié à cet employé ;
        remplace le lien si le compte était lié à un autre employé.
        Effet immédiat sur l'API (l'employeId est relu en base à chaque requête).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LierEmploye"
      responses:
        "200":
          description: Compte mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: employeId manquant
        "401":
          description: Token manquant ou invalide
        "403":
          description: Rôle insuffisant (ADMIN requis)
        "404":
          description: Utilisateur ou employé introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "409":
          description: Employé déjà lié à un autre compte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /users/{id}/role:

    patch:
      tags:
        - Utilisateurs
      summary: Changer le rôle d'un compte (ADMIN)
      description: >
        Passe un compte en ADMIN ou en EMPLOYE. Sans effet si le compte a déjà ce rôle.
        Effet immédiat sur l'API (le rôle est relu en base à chaque requête).
        Le décompte des ADMIN et la mise à jour se font dans une même transaction, lignes ADMIN
        verrouillées : deux rétrogradations simultanées ne peuvent pas supprimer le dernier ADMIN.
        POST /auth/register crée toujours un EMPLOYE : c'est la seule façon de promouvoir un compte, avec le seed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangerRole"
      responses:
        "200":
          description: Compte mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Rôle absent ou invalide
        "401":
          description: Token manquant ou invalide
        "403":
          description: Rôle insuffisant (ADMIN requis), ou modification de son propre rôle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Utilisateur introuvable
        "409":
          description: Rétrogradation du dernier administrateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
